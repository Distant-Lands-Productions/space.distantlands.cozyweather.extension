name: Setup Template Project

on:
  push:
    branches:
      - main
      - master

jobs:
  rename-project:
    # Only run if not the template repo AND if template setup hasn't completed yet
    if: github.repository != 'DistantLandsProductions/space.distantlands.cozyweather.extension'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if already initialized
        id: check_init
        run: |
          if [ -f ".template-initialized" ]; then
            echo "already_run=true" >> $GITHUB_OUTPUT
          else
            echo "already_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Replace Placeholder Strings
        if: steps.check_init.outputs.already_run == 'false'
        run: |
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          LOWER_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          CAP_REPO_NAME="$(echo "${LOWER_REPO_NAME:0:1}" | tr '[:lower:]' '[:upper:]')${LOWER_REPO_NAME:1}"
          FULL_PACKAGE_ID="space.distantlands.cozyweather.${LOWER_REPO_NAME}"

          # Replace placeholders across files
          find . -type f -not -path '*/.git/*' -exec sed -i "s/com\.example\.extension/${FULL_PACKAGE_ID}/g" {} +
          find . -type f -not -path '*/.git/*' -exec sed -i "s/Extension/${CAP_REPO_NAME}/g" {} +
          find . -type f -not -path '*/.git/*' -exec sed -i "s/extension/${LOWER_REPO_NAME}/g" {} +

          # Create initialization marker
          touch .template-initialized

      - name: Commit and Push Changes
        if: steps.check_init.outputs.already_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: setup project from template replacing placeholders with repo name"
            git push
          fi
