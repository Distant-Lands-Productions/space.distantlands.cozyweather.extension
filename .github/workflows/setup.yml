name: Initialize Template

on:
  push:
    branches:
      - main # Change if your default branch is different

permissions:
  contents: write

jobs:
  setup:
    # IMPORTANT: Prevent this from running in the template repository itself
    if: ${{ github.repository != 'Distant-Lands-Productions/space.distantlands.cozyweather.extension' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_TEMPLATE_PAT || secrets.GITHUB_TOKEN }}

      - name: Process Repository Names
        id: names
        run: |
          # Extract repository name cleanly from github.repository (e.g. "Distant-Lands-Productions/Blocks" -> "Blocks")
          FULL_REPO="${{ github.repository }}"
          REPO_NAME="${FULL_REPO##*/}"
          
          # All lowercase (e.g., 'blocks')
          LOW_NAME="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"

          # Capitalize first letter (e.g., 'Blocks')
          CAP_NAME="$(tr '[:lower:]' '[:upper:]' <<< ${LOW_NAME:0:1})${LOW_NAME:1}"
          
          echo "cap_name=$CAP_NAME" >> $GITHUB_OUTPUT
          echo "low_name=$LOW_NAME" >> $GITHUB_OUTPUT

      - name: Rename and Make Repository Private
        env:
          GH_TOKEN: ${{ secrets.ORG_TEMPLATE_PAT }}
        run: |
          OLD_REPO="${{ github.repository }}"
          NEW_NAME="space.distantlands.cozyweather.${{ steps.names.outputs.low_name }}"
          
          # 1. Rename the repository
          gh repo rename "$NEW_NAME" --repo "$OLD_REPO" --yes
          
          # 2. Extract owner/org name and construct updated repo target
          OWNER="${OLD_REPO%%/*}"
          NEW_REPO="$OWNER/$NEW_NAME"
          
          # 3. Change visibility back to Private
          gh repo edit "$NEW_REPO" --visibility private --accept-visibility-change-consequences
        continue-on-error: true

      - name: Update package.json Description
        env:
          GH_TOKEN: ${{ secrets.ORG_TEMPLATE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the repository description using GitHub CLI
          REPO_DESC="$(gh repo view "${{ github.repository }}" --json description -q '.description')"

          # Only update package.json if a description exists on GitHub
          if [ -n "$REPO_DESC" ] && [ "$REPO_DESC" != "null" ] && [ -f "package.json" ]; then
            # Update the description field in package.json using jq
            jq --arg desc "$REPO_DESC" '.description = $desc' package.json > package.tmp.json && mv package.tmp.json package.json
          fi

      - name: Rename Files and Directories
        env:
          CAP_NAME: ${{ steps.names.outputs.cap_name }}
          LOW_NAME: ${{ steps.names.outputs.low_name }}
        run: |
          # Depth-first renaming handles nested files safely. Applies to C# scripts, .meta files, and directories.
          find . -depth -name '*Extension*' -execdir bash -c 'mv "$1" "${1//Extension/$CAP_NAME}"' _ {} \;
          find . -depth -name '*extension*' -execdir bash -c 'mv "$1" "${1//extension/$LOW_NAME}"' _ {} \;

      - name: Find and Replace Text in Files
        env:
          CAP_NAME: ${{ steps.names.outputs.cap_name }}
          LOW_NAME: ${{ steps.names.outputs.low_name }}
        run: |
          # grep -Il ignores binary files. Limits sed only to text files like JSON, ASMDEF, and C#.
          find . -type f -not -path '*/\.git/*' -exec grep -Il 'Extension' {} + | xargs -r sed -i "s/Extension/$CAP_NAME/g"
          find . -type f -not -path '*/\.git/*' -exec grep -Il 'extension' {} + | xargs -r sed -i "s/extension/$LOW_NAME/g"

      - name: Delete Setup Workflow
        run: |
          rm .github/workflows/setup.yml

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.ORG_TEMPLATE_PAT }}
        run: |
          NEW_REPO_NAME="space.distantlands.cozyweather.${{ steps.names.outputs.low_name }}"
          OWNER="${{ github.repository_owner }}"
          
          # 1. Update git remote origin to point to the newly renamed repository URL
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${NEW_REPO_NAME}.git"
          
          # 2. Configure bot author
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Add, commit, and push directly using the authenticated token URL
          git add .
          git commit -m "chore: initialize repository from template"
          git push origin HEAD:main
